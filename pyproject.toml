[project]
name = "sayane-tidb-context-store-demo"
version = "0.1.0"
description = "A minimal TiDB Cloud backed Context Store demo for Sayane."
authors = [
  { name = "Tomoyuki Kano", email = "tomyuk@zyxcorp.jp" }
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pymysql>=1.1",
  "sqlalchemy>=2.0",
  "openai>=1.30",
]

[project.scripts]
sayane-tidb-demo = "sayane_tidb_demo.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
